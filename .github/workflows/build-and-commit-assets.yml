name: Build and Upload Assets

on:
  push:
    branches:
      - 'develop'
      - 'v*'
      - 'version-*'

concurrency:
  group: build-assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: write

jobs:
  build-assets:
    name: Build JS/CSS and upload to release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          path: apps/frappe

      - name: Create bench structure
        run: |
          mkdir -p sites
          echo "frappe" > sites/apps.txt

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: apps/frappe/yarn.lock

      - name: Install JS dependencies
        working-directory: apps/frappe
        run: yarn install --frozen-lockfile

      - name: Link node_modules into public/
        working-directory: apps/frappe
        run: ln -s "$PWD/node_modules" frappe/public/node_modules

      - name: Build assets (production)
        working-directory: apps/frappe
        run: yarn run production

      - name: Package assets
        working-directory: apps/frappe
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          tar -czhf frappe-$VERSION.tar.gz -C ../../sites/assets/frappe dist

      - name: Configure DO Spaces Credentials
        uses: BetaHuhn/do-spaces-action@v2
        with:
          space_region: sgp1 # Dummy region required by AWS action, DO uses endpoint-url instead
          access_key: ${{ secrets.DO_SPACES_KEY }}
          secret_key: ${{ secrets.DO_SPACES_SECRET }}
          space_name: ${{ secrets.DO_SPACES_NAME }}
          source: apps/frappe/frappe-${{ env.version }}.tar.gz

      - name: Upload to rolling release
        working-directory: apps/frappe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          TAG="assets-${GITHUB_REF_NAME//\//-}"
          gh release create "$TAG" --prerelease --title "Assets: $GITHUB_REF_NAME" --notes "" 2>/dev/null || true
          gh release upload "$TAG" frappe-$VERSION.tar.gz --clobber
